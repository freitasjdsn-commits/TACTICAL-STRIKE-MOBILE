<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TACTICAL STRIKE MOBILE</title><link rel="stylesheet" href="style.css?v=35b7dd1"><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="renderCanvas"></canvas><button id="fullscreen" type="button" aria-label="Ativar tela cheia">⛶</button><button id="audio-toggle" type="button" aria-pressed="true">SOM ON</button><header><b>TACTICAL STRIKE <span>MOBILE</span></b><small>ÁREA DE TREINO</small></header><div id="mission">ELIMINE OS BOTS VERMELHOS</div><svg id="weapon-overlay" viewBox="0 0 520 300" aria-hidden="true"><defs><linearGradient id="gunmetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52616b"/><stop offset=".42" stop-color="#17232c"/><stop offset="1" stop-color="#080e14"/></linearGradient><linearGradient id="redtrim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff6276"/><stop offset="1" stop-color="#8e1830"/></linearGradient></defs><g transform="translate(115 42) rotate(-13 190 130)" stroke="#080d12" stroke-width="8" stroke-linejoin="round"><path d="M170 130 L300 110 L435 126 L430 157 L300 151 L184 165Z" fill="url(#gunmetal)"/><path d="M286 116 L470 105 L500 117 L496 135 L302 143Z" fill="#111b23"/><path d="M380 112 L496 105 L500 117 L382 128Z" fill="#65747c"/><path d="M190 156 L245 160 L258 245 L220 259 L186 207Z" fill="#111b23"/><path d="M245 161 L286 157 L294 230 L260 245Z" fill="url(#gunmetal)"/><path d="M178 135 L280 122 L286 157 L185 171Z" fill="url(#gunmetal)"/><path d="M200 127 L271 119 L274 129 L202 139Z" fill="url(#redtrim)" stroke="none"/><path d="M230 110 L250 77 L301 72 L315 111Z" fill="#111a21"/><path d="M240 78 L252 53 L294 51 L307 76Z" fill="#273640"/><path d="M251 57 L291 55 L294 69 L252 72Z" fill="#9a263d" stroke="none"/><path d="M300 132 L350 126 L354 144 L302 151Z" fill="#35434b"/><path d="M165 143 L205 137 L207 164 L168 170Z" fill="#202d35"/></g></svg><div id="crosshair">+</div><aside id="tactical"><div class="map-title">RADAR <span>● AO VIVO</span></div><div id="minimap"><i class="player-dot"></i><i class="enemy-dot e1"></i><i class="enemy-dot e2"></i><i class="enemy-dot e3"></i><i class="enemy-dot e4"></i></div><div class="systems"><span>ESP <b>ON</b></span><span>RADAR <b>ON</b></span></div></aside><div id="hud"><b id="health">♥ 100</b><b id="ammo">30 / 90</b></div><div id="joystick"><i id="stick"></i></div><div id="actions"><button id="fire">ATIRAR</button><button id="reload">↻ RECARREGAR</button><button id="jump">⬆ PULAR</button></div><div id="message"></div><script>
(function(){
 const out=document.getElementById("message");
 function report(label,detail){if(out){out.textContent=label+(detail?": "+detail:"");out.style.cssText+=";background:#260b12eF;border:1px solid #ff526b;padding:12px 16px;border-radius:8px;max-width:92vw;z-index:99;";}}
 window.addEventListener("error",function(e){report("FALHA NO JOGO",e.message||"erro de script");});
 window.addEventListener("unhandledrejection",function(e){const r=e.reason;report("FALHA DE INICIALIZAÇÃO",r&&r.message?r.message:String(r||"promessa rejeitada"));});
 if(!window.BABYLON){report("BIBLIOTECA 3D NÃO CARREGOU","verifique a conexão e recarregue a página");}
 else {
  const probe=document.createElement("canvas");
  const gl=probe.getContext("webgl2")||probe.getContext("webgl")||probe.getContext("experimental-webgl");
  if(!gl)report("WEBGL INDISPONÍVEL","este navegador não liberou aceleração 3D");
 }
})();
</script>
<script src="game.js?v=fix-material-order-2"></script><script>
(function(){
 const btn=document.getElementById("fullscreen");
 const root=document.documentElement;
 function sync(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains("immersive"));btn.textContent=active?"⤢":"⛶";btn.setAttribute("aria-label",active?"Sair da tela cheia":"Ativar tela cheia");}
 btn.addEventListener("click",async function(){
  const active=!!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains("immersive"));
  if(active){
   if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen().catch(()=>{});
   else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
   document.body.classList.remove("immersive");
  }else{
   let entered=false;
   try{if(root.requestFullscreen){await root.requestFullscreen();entered=!!document.fullscreenElement;}else if(root.webkitRequestFullscreen){root.webkitRequestFullscreen();entered=!!document.webkitFullscreenElement;}}catch(e){}
   if(!entered)document.body.classList.add("immersive");
   try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape");}catch(e){}
  }
  sync();
 });
 document.addEventListener("fullscreenchange",sync);
 document.addEventListener("webkitfullscreenchange",sync);
})();
</script><style id="controls-hotfix">
